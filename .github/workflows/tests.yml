name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # --locked installs exactly what uv.lock pins and fails if it has drifted.
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run pytest -q
