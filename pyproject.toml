[project]
name = "eosc-catalogues-test"
version = "0.1.0"
description = "Queries EOSC Node Service and Resource Catalogues, checks their compliance and assesses their content"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
    "jinja2>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalogue_check"]

[project.scripts]
catalogue-check = "catalogue_check.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]
[tool.ruff.lint.per-file-ignores]
# typer's API puts calls in argument defaults; that is how it is meant to be used.
"src/catalogue_check/cli.py" = ["B008"]
