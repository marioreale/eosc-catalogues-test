# Catalogues to query, one entry per catalogue endpoint.
#
# Fields
#   id        stable identifier, used in evidence file names
#   node      node id, as in eosc-basic-compliance's nodes.yaml
#   name      catalogue name (the production sheet names nodes, not
#             catalogues; the name is the one the catalogue gives itself)
#   type      service-catalogue | research-product-catalogue
#   protocol  een-services-api (GET /services, Service Bundle records)
#             | oai-pmh (research products, harvested via OpenAIRE)
#   endpoint  the URL queried; for oai-pmh the base URL, without ?verb=
#   display_endpoint
#             optional: the URL shown on the results page when it differs
#             from the one queried (see the note of the entry)
#   website   human-facing catalogue site, where known
#   listed    what the production sheet says about the catalogue, quoted,
#             not verified here (research product catalogues only):
#             comment = its "Comments" column,
#             evaluation_eosc_a = its "Evaluation / EOSC-A" column
#   source    where the endpoint comes from: "production", or "resource-hub"
#             for the three Poland catalogues
#   note      anything a reader needs to know before trusting the entry
#
# Source: production_env_node_services.xlsx (shared in October 2026, a
# snapshot, not a live census):
#   tab "Services", column "Service Catalogue registered" (10 nodes), and
#   tab "Research product catalogues", column "Research Product Catalogue
#   registered" (11 rows). Two of those rows are left out because they are
#   web pages, not OAI-PMH endpoints: Finland's https://metax.fairdata.fi/
#   ("Improvement requested") and Poland's https://odis.ecudo.pl/
#   ("Improvement requested -> should probably be permenent rejected since it
#   is a scientific database").
#
# Exception, for Poland only: the EOSC EU Node Resource Hub's Data Sources
# (https://open-science-cloud.ec.europa.eu/resources/datasources), read through
# its public catalogue API on 4 November 2026. The Hub has no comment or
# evaluation column, so these entries quote nothing; the note gives the Hub
# record PID.
#
# Every endpoint below answered one request on 23 October or 4 November 2026
# unless the note says otherwise. That shows the endpoint is up, nothing about
# compliance. The results page probes them again on every run.

catalogues:

  # ---------------------------------------------------------------- services
  - id: bbmri-eric-services
    node: bbmri-eric
    name: EOSC Node BBMRI-ERIC Service Catalogue
    type: service-catalogue
    protocol: een-services-api
    endpoint: https://eosc-catalogue.bbmri-eric.eu/services
    website: https://eosc-catalogue.bbmri-eric.eu
    source: production

  - id: eosc-fi-services
    node: eosc-fi
    name: EOSC-FI Service Catalogue
    type: service-catalogue
    protocol: een-services-api
    endpoint: https://data.eosc.fi/v1/services
    website: https://eosc.fi
    source: production

  - id: eosc-dto-services
    node: eosc-dto
    name: European DTO Service Catalogue
    type: service-catalogue
    protocol: een-services-api
    endpoint: https://gcat.d4science.org/gcat/ext/eosc/EOSC-Node-DTO/services
    website: https://eosc-dto.d4science.org/service-catalogue-organization/eoscnodedto-catalogue
    source: production

  - id: eosc-sk-services
    node: eosc-sk
    name: EOSC Slovakia - Service Catalogue
    type: service-catalogue
    protocol: een-services-api
    endpoint: https://sc.eosc.sk/api/v1/services
    website: https://sc.eosc.sk/
    source: production
    note: >-
      Its envelope adds node, quantity, order, sort and version to
      total/from/to, unlike the others.

  - id: data-terra-services
    node: data-terra
    name: Data Terra EOSC Node Service Catalogue
    type: service-catalogue
    protocol: een-services-api
    endpoint: https://services.earth-data.eu/services
    website: https://earth-data.eu/
    source: production

  - id: eudat-services
    node: eudat
    name: EUDAT Node Service Catalogue
    type: service-catalogue
    protocol: een-services-api
    endpoint: https://portal.eudat.eu/api/services
    website: https://portal.eudat.eu/catalog
    source: production

  - id: geant-services
    node: geant
    name: GEANT Service Catalogue
    type: service-catalogue
    protocol: een-services-api
    endpoint: https://geant-node-catalogue.geant.org/services
    website: https://geant-node-catalogue.geant.org
    source: production
    note: >-
      Unlike GÉANT's landing page, the catalogue API answered without a
      Cloudflare challenge.

  - id: egi-services
    node: egi
    name: EGI Service Catalogue
    type: service-catalogue
    protocol: een-services-api
    endpoint: https://egi-eosc-catalogue.dyn.cloud.e-infra.cz/services
    website: https://www.egi.eu/services
    source: production
    note: >-
      The host root, https://egi-eosc-catalogue.dyn.cloud.e-infra.cz/,
      answers HTTP 404; /services is the listing (16 services on
      4 November 2026, all in one page).

  - id: eosc-it-services
    node: eosc-it
    name: EOSC Node | Italy Service Catalogue
    type: service-catalogue
    protocol: een-services-api
    endpoint: https://gcat.d4science.org/gcat/ext/eosc/EOSC-IT_Node/services
    website: https://eosc.it/catalogue
    source: production
    note: >-
      Same gCat software as the DTO catalogue. Its listing includes IRIS
      AperTO, which is also listed below as a research product catalogue.

  - id: panosc-services
    node: panosc
    name: PaNOSC Service Catalogue
    type: service-catalogue
    protocol: een-services-api
    endpoint: https://pan-training.eu/service-catalogue/api/v3/services
    website: https://services.tesshub.hzdr.de/collections/eosc-panosc-node-services
    source: production
    note: >-
      Paginated: 17 services on 4 November 2026, 10 returned per page. Like
      Slovakia's, its envelope adds count, order, sort and version.

  # ------------------------------------------------------ research products
  - id: bbmri-eric-oai
    node: bbmri-eric
    name: EOSC Node BBMRI-ERIC Data Set Catalogue
    type: research-product-catalogue
    protocol: oai-pmh
    endpoint: https://eosc-catalogue.bbmri-eric.eu/oai
    listed: {comment: Improvement requested}
    source: production

  - id: cern-opendata-oai
    node: cern
    name: CERN Open Data Portal
    type: research-product-catalogue
    protocol: oai-pmh
    endpoint: https://opendata.cern/oai2d
    source: production
    note: The sheet gives https://opendata.cern/oai2d?verb=Identify; the base URL is used here.

  - id: eosc-it-cnr-iris-oai
    node: eosc-it
    name: CNR IRIS
    type: research-product-catalogue
    protocol: oai-pmh
    endpoint: https://iris.cnr.it/oai/openaire4
    source: production
    note: Did not answer Identify within 20 s on 23 October 2026, nor in some later runs.

  - id: eosc-it-unito-iris-oai
    node: eosc-it
    name: IRIS AperTO (Università di Torino)
    type: research-product-catalogue
    protocol: oai-pmh
    endpoint: https://iris.unito.it/oai/openaire4
    source: production
    note: Did not answer Identify within 20 s on 23 October 2026.

  - id: data-terra-oai
    node: data-terra
    name: Data Terra research products
    type: research-product-catalogue
    protocol: oai-pmh
    endpoint: https://resources.earth-data.eu/oai
    listed: {comment: Improvement requested}
    source: production

  - id: panosc-rodare-oai
    node: panosc
    name: RODARE (Rossendorf Data Repository)
    type: research-product-catalogue
    protocol: oai-pmh
    endpoint: https://rodare.hzdr.de/oai2d
    source: production
    note: The sheet gives https://rodare.hzdr.de/oai2d?verb=Identify; the base URL is used here.

  - id: eudat-b2find-oai
    node: eudat
    name: B2FIND
    type: research-product-catalogue
    protocol: oai-pmh
    endpoint: https://b2find.eudat.eu/oai
    listed: {evaluation_eosc_a: "Catalogue openly accessible, UAP/AUP linked"}
    source: production

  - id: eosc-dto-zenodo-oai
    node: eosc-dto
    name: EOSC Node | EU DTO Zenodo Community
    type: research-product-catalogue
    protocol: oai-pmh
    endpoint: https://zenodo.org/oai2d
    source: production
    note: >-
      This is all of Zenodo; the node's records are one community, so a harvest
      needs that community's OAI set, still to be identified.

  - id: eosc-cz-nmd-oai
    node: eosc-cz
    name: National Metadata Directory
    type: research-product-catalogue
    protocol: oai-pmh
    endpoint: https://test1.nma.du.cesnet.cz/oai2d
    display_endpoint: https://nma.du.cesnet.cz/oai2d
    listed: {evaluation_eosc_a: "https://test1.nma.du.cesnet.cz/"}
    source: production
    note: >-
      Shown as https://nma.du.cesnet.cz/oai2d, the intended production
      address, but queried at https://test1.nma.du.cesnet.cz/oai2d, the
      address the production sheet lists. On 4 November 2026 the production
      address did not work: its server presented a generic certificate ("TRAEFIK
      DEFAULT CERT", not valid for the host) and answered "404 page not
      found"; the test1 address answered Identify.

  # Poland: not in the production sheet, whose only Poland row
  # (https://odis.ecudo.pl/) is a web page; these three come from the Resource Hub.
  - id: eosc-pl-mostwiedzy-oai
    node: eosc-pl
    name: Most Wiedzy Open Research Data Catalog
    type: research-product-catalogue
    protocol: oai-pmh
    endpoint: https://mostwiedzy.pl/en/oai-pmh
    website: https://mostwiedzy.pl/
    source: resource-hub
    note: >-
      Hub record 21.11166/kFNSMX (registered 5 October 2026), re3data
      r3d100013366. The Hub records it as not OpenAIRE-compliant ("Not
      compatible / Not relevant"). Identify reports its baseURL with a
      trailing slash.

  - id: eosc-pl-repod-oai
    node: eosc-pl
    name: RepOD Repository for Open Data
    type: research-product-catalogue
    protocol: oai-pmh
    endpoint: https://repod.icm.edu.pl/oai
    website: https://repod.icm.edu.pl/
    source: resource-hub
    note: >-
      Hub record 21.11166/3S6tct (registered 7 October 2026). The Hub
      declares https://repod.icm.edu.pl/oai?verb=Identify; the base URL is
      used here, as Identify confirms (a Dataverse OAI server). The Hub records
      it as not OpenAIRE-compliant.

  - id: eosc-pl-rohub-oai
    node: eosc-pl
    name: ROHub
    type: research-product-catalogue
    protocol: oai-pmh
    endpoint: https://api.rohub.org/api/oai2d/
    website: https://reliance.rohub.org/
    source: resource-hub
    note: >-
      Hub record 21.11166/l9sqU5 (registered 7 October 2026), re3data
      r3d100013832, declared OpenAIRE 4.0 compatible. Its Identify response
      gives a broken baseURL ("https://<arguments.base.Str object at …>/api/oai2d/"),
      which a harvester that trusts Identify would follow.
